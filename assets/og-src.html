<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 900px 500px at 78% 18%, rgba(217, 138, 151, 0.14), transparent 65%),
      radial-gradient(ellipse 1000px 600px at 15% 85%, rgba(70, 90, 160, 0.20), transparent 65%),
      radial-gradient(ellipse 700px 420px at 30% 20%, rgba(201, 162, 75, 0.08), transparent 60%),
      linear-gradient(165deg, #04070f 0%, #060b18 55%, #0a1020 100%);
    font-family: 'Inter', sans-serif;
  }
  canvas#stars { position: absolute; inset: 0; }
  svg.lines { position: absolute; inset: 0; }

  .frame {
    position: absolute;
    inset: 26px;
    border: 1px solid rgba(230, 200, 119, 0.16);
  }
  .corner {
    position: absolute;
    width: 26px; height: 26px;
    border-color: rgba(230, 200, 119, 0.55);
    border-style: solid;
    border-width: 0;
  }
  .corner.tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
  .corner.tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 8px;
  }
  .kicker {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.52em;
    text-indent: 0.52em;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 26px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 108px;
    line-height: 1;
    letter-spacing: 0.055em;
    background: linear-gradient(160deg, #f8f3e6 15%, #e6c877 60%, #b98f3e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 34px rgba(230, 200, 119, 0.28));
  }
  .rule {
    width: 190px;
    height: 1px;
    margin: 30px 0 26px;
    background: linear-gradient(to right, transparent, rgba(230, 200, 119, 0.75), transparent);
    position: relative;
  }
  .rule::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 5px; height: 5px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: #e6c877;
    box-shadow: 0 0 10px rgba(230, 200, 119, 0.9);
  }
  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.55;
    color: #b9b2a2;
  }
  .sub .em { color: #e8e4da; }
  .hint {
    position: absolute;
    bottom: 52px;
    left: 0; right: 0;
    text-align: center;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: rgba(217, 138, 151, 0.85);
  }
  .hint .sep { color: rgba(201, 162, 75, 0.7); margin: 0 6px; }

  /* Polaris */
  .polaris {
    position: absolute;
    top: 108px; right: 158px;
    width: 0; height: 0;
  }
  .polaris .glow {
    position: absolute;
    width: 190px; height: 190px;
    left: -95px; top: -95px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240, 183, 192, 0.5) 0%, rgba(240, 183, 192, 0.14) 40%, transparent 70%);
  }
  .polaris .core {
    position: absolute;
    width: 9px; height: 9px;
    left: -4.5px; top: -4.5px;
    border-radius: 50%;
    background: #fbe3e7;
    box-shadow: 0 0 18px rgba(251, 227, 231, 0.95);
  }
  .polaris .ray-h, .polaris .ray-v {
    position: absolute;
    background: linear-gradient(to right, transparent, rgba(240, 183, 192, 0.8), transparent);
  }
  .polaris .ray-h { width: 150px; height: 1px; left: -75px; top: 0; }
  .polaris .ray-v { width: 1px; height: 150px; left: 0; top: -75px; background: linear-gradient(to bottom, transparent, rgba(240, 183, 192, 0.8), transparent); }

  /* meteor */
  .meteor {
    position: absolute;
    top: 352px; left: 55px;
    width: 180px; height: 2px;
    transform: rotate(-14deg);
    background: linear-gradient(to right, transparent, rgba(240, 220, 190, 0.85));
    border-radius: 2px;
  }
  .meteor::after {
    content: '';
    position: absolute;
    right: -3px; top: -2px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #f6ecd2;
    box-shadow: 0 0 14px rgba(246, 236, 210, 1);
  }

  .vig {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2, 4, 9, 0.6) 100%);
  }
</style>
</head>
<body>

<canvas id="stars" width="1200" height="630"></canvas>

<svg class="lines" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- faint constellations drifting at the edges -->
  <g stroke="rgba(230, 200, 119, 0.30)" stroke-width="1">
    <path d="M 92 128 L 172 84 L 246 132 L 218 208 L 128 196 Z" />
    <path d="M 1012 470 L 1084 428 L 1136 492 L 1074 548 Z" />
    <path d="M 152 470 L 224 512 L 204 578" />
    <path d="M 962 118 L 1030 88 L 1092 130" opacity="0.6" />
  </g>
  <g fill="#f6ecd2">
    <circle cx="92" cy="128" r="2.6" opacity="0.95" /><circle cx="172" cy="84" r="2.1" opacity="0.8" />
    <circle cx="246" cy="132" r="2.4" opacity="0.9" /><circle cx="218" cy="208" r="1.9" opacity="0.75" />
    <circle cx="128" cy="196" r="2.2" opacity="0.8" />
    <circle cx="1012" cy="470" r="2.4" opacity="0.9" /><circle cx="1084" cy="428" r="2" opacity="0.8" />
    <circle cx="1136" cy="492" r="2.5" opacity="0.9" /><circle cx="1074" cy="548" r="1.9" opacity="0.75" />
    <circle cx="152" cy="470" r="2.3" opacity="0.85" /><circle cx="224" cy="512" r="1.9" opacity="0.7" />
    <circle cx="204" cy="578" r="2.1" opacity="0.8" />
    <circle cx="962" cy="118" r="2" opacity="0.7" /><circle cx="1030" cy="88" r="2.3" opacity="0.85" />
    <circle cx="1092" cy="130" r="1.9" opacity="0.7" />
  </g>
  <!-- glow under constellation stars -->
  <g fill="rgba(230, 200, 119, 0.14)">
    <circle cx="92" cy="128" r="13" /><circle cx="246" cy="132" r="12" />
    <circle cx="1012" cy="470" r="12" /><circle cx="1136" cy="492" r="13" />
    <circle cx="152" cy="470" r="11" /><circle cx="1030" cy="88" r="11" />
  </g>
</svg>

<div class="polaris">
  <div class="glow"></div>
  <div class="ray-h"></div>
  <div class="ray-v"></div>
  <div class="core"></div>
</div>

<div class="meteor"></div>

<div class="content">
  <div class="kicker">A letter from the machine</div>
  <h1>WHILE YOU SLEPT</h1>
  <div class="rule"></div>
  <p class="sub">You wrote the history of the machines.<br/>
  <span class="em">Tonight, a machine wrote yours.</span></p>
</div>

<div class="hint">Five constellations <span class="sep">·</span> One fixed star <span class="sep">·</span> One hidden secret</div>

<div class="vig"></div>
<div class="frame">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
</div>

<script>
  const c = document.getElementById('stars');
  const x = c.getContext('2d');
  let s = 7;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 340; i++) {
    const px = rnd() * 1200, py = rnd() * 630;
    const r = 0.3 + rnd() * 1.1;
    const warm = rnd() < 0.18;
    x.globalAlpha = 0.18 + rnd() * 0.6;
    x.fillStyle = warm ? '#eddcb2' : '#cdd6e8';
    x.beginPath();
    x.arc(px, py, r, 0, Math.PI * 2);
    x.fill();
    if (rnd() < 0.06) {
      x.globalAlpha = 0.10;
      x.beginPath();
      x.arc(px, py, r * 5, 0, Math.PI * 2);
      x.fill();
    }
  }
</script>
</body>
</html>
